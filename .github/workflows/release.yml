name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  # Same checks as CI, so nothing is versioned or published unless they pass on this commit.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # setup-node's pnpm cache is actions/cache, which cannot save a cache entry without this.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check registry
        run: pnpm registry:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Doctor
        run: node dist/cli.js doctor

      - name: Check package
        run: pnpm check:package

      - name: Smoke test packed tarball
        run: pnpm smoke

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # pnpm release = build + changeset publish (provenance via publishConfig).
          # Build only here on publish runs — avoid a second pnpm build before the action.
          # v2 configures GitHub auth via github-token (not a GITHUB_TOKEN env var).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
